name: BotPicks Autonomous System

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
  workflow_dispatch:

jobs:
  run-botpicks:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run BotPicks
      run: |
        python main.py

    - name: Auto-restart safeguard
      if: failure()
      run: |
        echo "Run failed, retrying..."
        python main.py
